<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eBay AI Assistant — V0</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        font-size: 13px;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px;
        background: #fff;
        color: #111;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 8px 0;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        background: #eee;
        color: #555;
      }
      .pill[data-state="idle"] {
        background: #e5f3ff;
        color: #0654ba;
      }
      .pill[data-state="syncing"] {
        background: #fff4d6;
        color: #8a5a00;
      }
      .pill[data-state="error"] {
        background: #ffe1e1;
        color: #b00020;
      }
      .pill[data-state="loading"] {
        background: #f0f0f0;
        color: #555;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        margin-top: 10px;
        border-radius: 6px;
        border: 1px solid #d0d0d0;
        background: #0654ba;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .stats {
        margin-top: 10px;
        padding: 8px 10px;
        background: #fafafa;
        border-radius: 6px;
        font-size: 12px;
        color: #333;
        min-height: 18px;
      }
      .stats.error {
        background: #fff5f5;
        color: #b00020;
      }
      footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #eee;
        font-size: 11px;
        color: #888;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      footer a {
        color: #0654ba;
        text-decoration: none;
      }
      .api-url {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>
      eBay AI Assistant — V0
      <span id="state-pill" class="pill" data-state="loading">loading</span>
    </h1>
    <button id="sync-btn" type="button">Sync now</button>
    <div id="stats" class="stats">No sync yet.</div>
    <footer>
      <span>Manage at <a href="#" id="ext-link">chrome://extensions</a></span>
      <span>API: <span id="api-url" class="api-url">…</span></span>
    </footer>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
